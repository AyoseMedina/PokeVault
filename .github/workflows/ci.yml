name: Tests & Docker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Tests and container / Pruebas y contenedor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Test / Probar
        run: npm test
      - name: Authentication tests / Pruebas de acceso
        run: |
          npm --prefix server ci --ignore-scripts
          npm run test:auth
          node server/tests/docker-smoke.mjs --prepare
      - name: Build and start / Construir e iniciar
        run: docker compose --env-file .test-output/auth-ci.env -p pokevault-ci up -d --build --wait --wait-timeout 60
      - name: Check HTTP / Comprobar HTTP
        run: node server/tests/docker-smoke.mjs
      - name: Validate cloud / Validar nube
        run: |
          docker compose --env-file .test-output/auth-ci.env -f compose.cloud.yaml -p pokevault-cloud-ci config --quiet
          docker compose --env-file .test-output/auth-ci.env -f compose.cloud.yaml -p pokevault-cloud-ci build caddy
          docker compose --env-file .test-output/auth-ci.env -f compose.cloud.yaml -p pokevault-cloud-ci run --rm --no-deps caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Logs / Registros
        if: failure()
        run: docker compose --env-file .test-output/auth-ci.env -p pokevault-ci logs --no-color
      - name: Cleanup / Limpiar
        if: always()
        run: |
          docker compose --env-file .test-output/auth-ci.env -p pokevault-ci down
          docker compose --env-file .test-output/auth-ci.env -f compose.cloud.yaml -p pokevault-cloud-ci down -v
