<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">PokéVault · Tu HOME clásico / Your classic HOME</title>
  <desc id="desc">Banco personal de Pokémon de generaciones I–V. Personal Pokémon bank for generations I–V. Local files, original saves preserved, Docker and Portainer.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ef4054" stroke-opacity=".07"/></pattern>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#191b22"/><stop offset="1" stop-color="#292b36"/></linearGradient>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#grid)"/>
  <circle cx="1080" cy="180" r="210" fill="none" stroke="#ef4054" stroke-opacity=".09"/>
  <circle cx="1080" cy="180" r="155" fill="none" stroke="#ef4054" stroke-opacity=".12"/>
  <g transform="translate(960 92)">
    <rect width="176" height="176" rx="49" fill="#292b36" stroke="#ef4054" stroke-opacity=".3"/>
    <g transform="translate(26 26) scale(1.94)">
      <path d="M14 30a18 18 0 0 1 36 0H14" fill="#ef4054"/>
      <path d="M14 34a18 18 0 0 0 36 0H14" fill="#ffffff"/>
      <circle cx="32" cy="32" r="7" fill="#191b22" stroke="#ffffff" stroke-width="3"/>
    </g>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="64" y="66" font-size="14" font-weight="600" letter-spacing="4" fill="#ef4054">R36S / ARKOS · GENERATIONS I–V</text>
    <text x="60" y="168" font-size="80" font-weight="700" letter-spacing="-3" fill="#ffffff">PokéVault</text>
    <text x="64" y="216" font-size="25" fill="#f5f5f8">Tus aventuras, en un mismo lugar.</text>
    <text x="64" y="252" font-size="21" fill="#c5c6d0">Your adventures, together in one place.</text>
    <g font-size="13" font-weight="600" text-anchor="middle" fill="#f5f5f8">
      <rect x="64" y="301" width="166" height="37" rx="18" fill="#3c2029"/><text x="147" y="325">LOCAL-FIRST</text>
      <rect x="242" y="301" width="180" height="37" rx="18" fill="#3c2029"/><text x="332" y="325">ORIGINALS PRESERVED</text>
      <rect x="434" y="301" width="190" height="37" rx="18" fill="#3c2029"/><text x="529" y="325">DOCKER + PORTAINER</text>
    </g>
    <text x="1048" y="310" text-anchor="middle" font-size="14" letter-spacing="3" fill="#ef4054">I · II · III · IV · V</text>
  </g>
</svg>
